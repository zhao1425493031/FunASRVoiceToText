# 会议实时字幕 v3 — 企业生产配置（单麦多人 + FSMN 句界 + SenseVoice + Pyannote）
# 启动: python scripts/run_meeting.py

host: "0.0.0.0"
port: 8766
service_mode: "meeting"
asr_backend: "meeting_sensevoice"
# GPU 生产服务器请改:
#   device: "cuda"
#   meeting_reuse_partial_for_final: false
#   meeting_partial_max_sec: 0
device: "auto"
language: "zh"

asr_model: "iic/SenseVoiceSmall"
vad_model: "fsmn-vad"
trust_remote_code: true

pyannote_model: "pyannote/speaker-diarization-community-1"
pyannote_window_sec: 12
pyannote_context_sec: 60
pyannote_step_sec: 2
pyannote_min_speakers: 1
pyannote_max_speakers: 0
pyannote_hf_token_env: "HF_TOKEN"
secrets_file: "secrets.meeting.yaml"

# 句界：两人对话收紧静音阈值，减少 A/B 合成一段
vad_energy_threshold: 0.005
vad_speech_hangover_ms: 300
vad_silence_ms: 700
vad_silence_long_ms: 1200
meeting_use_fsmn_endpoint: true
meeting_max_utterance_ms: 30000
meeting_min_utterance_ms: 400
meeting_min_finalize_chars: 6

# 定稿复用 partial 文本草稿，避免句末重复跑 ASR
meeting_reuse_partial_for_final: true
meeting_partial_max_sec: 0

min_partial_chars: 1
meeting_emit_partial: true
meeting_partial_interval_ms: 1200
meeting_partial_min_ms: 500

chunk_size: [0, 10, 5]
sample_rate: 16000
log_dir: "logs"

api_key: "meeting-dev-7k9m2p4x"
api_key_scopes:
  - meeting
max_ws_connections: 8

meeting_max_speakers: 8
meeting_session_max_seconds: 7200
meeting_spk_mode: multi
meeting_spk_source: "pyannote"
meeting_use_diarization: true
# Pyannote 检测到说话人切换时，提前定稿当前句并开新句
meeting_spk_change_finalize: true
# 企业级双通道：Pyannote 时间轴 + campplus 句级 embedding 实时回退（动态人数）
meeting_use_utterance_embedding: true
meeting_spk_embedding_model: "iic/speech_campplus_sv_zh-cn_16k-common"
meeting_spk_embedding_threshold: 0.72

ssl_certfile: "certs/cert.pem"
ssl_keyfile: "certs/key.pem"
