# 会议实时字幕 v3 — 企业生产配置（单麦多人 + FSMN 句界 + SenseVoice + Pyannote）
# 启动: python scripts/run_meeting.py

host: "0.0.0.0"
port: 8766
service_mode: "meeting"
asr_backend: "meeting_sensevoice"
# GPU 生产服务器请改:
#   device: "cuda"
device: "auto"
language: "zh"

asr_model: "iic/SenseVoiceSmall"
vad_model: "fsmn-vad"
trust_remote_code: true

pyannote_model: "pyannote/speaker-diarization-community-1"
pyannote_window_sec: 12
pyannote_context_sec: 60
pyannote_step_sec: 2
pyannote_min_speakers: 1
pyannote_max_speakers: 0
pyannote_hf_token_env: "HF_TOKEN"
secrets_file: "secrets.meeting.yaml"

# VAD：RMS 帧检测 + FSMN 句末 endpoint（行业标准叠层）
vad_energy_threshold: 0.01
vad_speech_onset_chunks: 1
vad_speech_hangover_ms: 300
vad_silence_ms: 800
vad_silence_long_ms: 1200
meeting_use_fsmn_endpoint: true
meeting_max_utterance_ms: 30000
meeting_min_utterance_ms: 400
meeting_min_finalize_chars: 2

# partial 预览整句递增识别；final 始终对整句完整 ASR
meeting_reuse_partial_for_final: false
meeting_partial_max_sec: 0

min_partial_chars: 1
meeting_emit_partial: true
meeting_partial_interval_ms: 1000
meeting_partial_min_ms: 500

chunk_size: [0, 10, 5]
sample_rate: 16000
log_dir: "logs"

api_key: "meeting-dev-7k9m2p4x"
api_key_scopes:
  - meeting
# 说话人状态按会话隔离；多路并发需 GPU 与独立算力，生产默认单路
max_ws_connections: 1

meeting_max_speakers: 8
meeting_session_max_seconds: 7200
meeting_spk_mode: multi
meeting_spk_source: "pyannote"
meeting_use_diarization: true
# 句界由 VAD/FSMN 决定，不因 diarization 滞后强拆句
meeting_spk_change_finalize: false
# 说话人：Pyannote 时间轴为主（行业标准）
meeting_use_utterance_embedding: false
meeting_spk_primary: "pyannote"
meeting_spk_embedding_model: "iic/speech_campplus_sv_zh-cn_16k-common"
meeting_spk_embedding_threshold: 0.72
meeting_pyannote_min_overlap_ms: 200

ssl_certfile: "certs/cert.pem"
ssl_keyfile: "certs/key.pem"

llm:
    enabled: true
    api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-plus"
    api_key: "sk-db1e44404e4a4dd3a65e05b7f4f87e39"
    temperature: 0.3
    max_tokens: 8096
    timeout: 120
    max_input_chars: 120000
    chunk_chars: 30000
    retry_max: 2
    retry_backoff_sec: 2
    on_failure: warn
    output_summary_md: true
    meeting_output_dir: "out/meetings"
    meeting_ws_wait_sec: 180
    api_version: ""
    deployment: ""