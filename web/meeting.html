<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>会議リアルタイム字幕</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="header">
    <h1>会議リアルタイム字幕</h1>
    <p class="subtitle" id="statusText">待機</p>
  </header>

  <main class="main">
    <section class="panel final-panel">
      <h2>字幕</h2>
      <div id="subtitleList" class="final-list"></div>
    </section>
    <section id="summaryPanel" class="panel summary-panel hidden">
      <div class="summary-header">
        <h2>会議纪要</h2>
        <div class="summary-actions">
          <button id="btnCopySummary" type="button" class="btn btn-ghost btn-sm" disabled>复制纪要</button>
          <button id="btnDownloadSummary" type="button" class="btn btn-ghost btn-sm" disabled>下载 .md</button>
        </div>
      </div>
      <p id="summaryStatus" class="summary-status"></p>
      <div id="summaryContent" class="summary-content"></div>
    </section>
  </main>

  <footer class="controls">
    <button id="btnStart" type="button" class="btn btn-primary">字幕開始</button>
    <button id="btnStop" type="button" class="btn btn-secondary" disabled>終了</button>
    <button id="btnClear" type="button" class="btn btn-ghost">クリア</button>
  </footer>

  <p class="hint" id="hintBox">読み込み中…</p>
  <script src="/static/meeting.js?v=20260605llm"></script>
</body>
</html>
