<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>リアルタイム音声認識</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="header">
    <h1>リアルタイム音声認識</h1>
    <p class="subtitle" id="statusText">待機</p>
  </header>

  <main class="main">
    <section class="panel partial-panel">
      <h2>認識原文</h2>
      <p id="partialText" class="text-display partial-display">—</p>
    </section>
    <section class="panel final-panel">
      <h2>確定稿</h2>
      <div id="finalList" class="final-list"></div>
    </section>
  </main>

  <footer class="controls">
    <button id="btnStart" type="button" class="btn btn-primary">認識開始</button>
    <button id="btnStop" type="button" class="btn btn-secondary" disabled>認識停止</button>
    <button id="btnClear" type="button" class="btn btn-ghost">クリア</button>
  </footer>

  <p class="hint" id="accessHint">PC と同じ Wi‑Fi を使用してください。iPhone は <strong>https://</strong>&lt;PCのIP&gt;:8765 でアクセス</p>
  <script src="/static/app.js?v=20260604c"></script>
</body>
</html>
