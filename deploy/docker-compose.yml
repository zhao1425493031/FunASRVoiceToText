# FunASR Runtime sidecar + VoiceToText gateway
# 1. Prepare model dirs per FunASR runtime docs (Japanese 2pass)
# 2. Copy deploy/runtime.env.example to deploy/runtime.env and edit paths
# 3. docker compose -f deploy/docker-compose.yml up -d

services:
  funasr-runtime:
    image: registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.12
    container_name: funasr-runtime
    ports:
      - "${RUNTIME_PORT:-10095}:10095"
    volumes:
      - ${RUNTIME_MODEL_DIR:-./models}:/workspace/models
    command:
      - /workspace/FunASR/runtime/websocket/build/bin/funasr-wss-server-2pass
      - --download-model-dir
      - /workspace/models
      - --model-dir
      - ${RUNTIME_MODEL_PATH:-damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-onnx}
      - --online-model-dir
      - ${RUNTIME_ONLINE_MODEL_PATH:-damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx}
      - --port
      - "10095"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 10095 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  voicetotext-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: voicetotext-gateway
    ports:
      - "${GATEWAY_PORT:-8765}:8765"
    environment:
      VOICETOTEXT_CONFIG: /app/config.enterprise.yaml
    volumes:
      - ../config.enterprise.yaml:/app/config.enterprise.yaml:ro
      - ../certs:/app/certs:ro
    depends_on:
      - funasr-runtime
    restart: unless-stopped
