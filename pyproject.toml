[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetotext"
version = "1.0.0"
description = "Enterprise Japanese real-time ASR (SenseVoice + FunASR Runtime gateway)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "funasr==1.3.9",
    "python-multipart>=0.0.9,<1.0.0",
    "websockets>=12.0,<14.0",
    "numpy>=1.24.0,<3.0.0",
    "PyYAML>=6.0,<7.0",
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "sounddevice>=0.4.6,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.26.0,<1.0.0",
    "websockets>=12.0,<14.0",
]

[project.scripts]
voicetotext-cli = "voicetotext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-p no:flask"
