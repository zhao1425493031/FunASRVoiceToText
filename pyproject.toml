[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicetotext"
version = "2.0.0"
description = "Offline audio transcription (SenseVoice + Pyannote)"
requires-python = ">=3.10"
dependencies = [
    "funasr>=1.3.3,<2.0.0",
    "numpy>=1.24.0,<3.0.0",
    "PyYAML>=6.0,<7.0",
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "soundfile>=0.12.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "pyannote.audio>=4.0.0,<5.0.0",
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = "-p no:flask"
